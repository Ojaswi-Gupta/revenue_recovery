<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecovrAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-700">
            <span class="text-emerald-500 mr-2 text-2xl">⚡</span>
            <span class="text-xl font-bold text-white tracking-wider">RecovrAI</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="block px-4 py-2 rounded-md hover:bg-gray-700 hover:text-emerald-400 transition-colors">Dashboard</a>
            <a href="/workflows" class="block px-4 py-2 rounded-md hover:bg-gray-700 hover:text-emerald-400 transition-colors">Workflows</a>
            <a href="/audit" class="block px-4 py-2 rounded-md hover:bg-gray-700 hover:text-emerald-400 transition-colors">Audit Trail</a>
            <a href="/voice/console" class="block px-4 py-2 rounded-md hover:bg-gray-700 hover:text-emerald-400 transition-colors">Voice Console</a>
            <a href="/report" class="block px-4 py-2 rounded-md hover:bg-gray-700 hover:text-emerald-400 transition-colors">Batch Report</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-6">
            <div class="flex items-center">
                <span class="text-gray-400 text-sm">System Status: <span class="text-emerald-500 font-medium ml-1">● Online</span></span>
            </div>
            <div class="text-gray-400 text-sm">
                <!-- Simple client side time display -->
                <script>document.write(new Date().toLocaleString());</script>
            </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-auto p-6">
            {% block content %}{% endblock %}
        </div>
    </main>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
